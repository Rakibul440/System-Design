<title id="t">Random and Power of Two Choices</title><desc id="d">P2C samples two random servers and chooses the less-loaded candidate.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#83c8f5"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eaf2ff}
.bg{fill:#0b1422} .node{fill:#17334d;stroke:#83c8f5;stroke-width:2}
.good{fill:#174638;stroke:#6bdcb0;stroke-width:2} .warn{fill:#4b303b;stroke:#ff8998;stroke-width:2}
.muted{fill:#a9bfd5;font-size:15px} .arrow{stroke:#83c8f5;stroke-width:3;fill:none;marker-end:url(#arr)}
</style></defs><rect class="bg" width="1000" height="470" rx="18"/><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700">Two random candidates are compared before routing</text><rect class="node" x="53.0" y="125" width="210.0" height="100" rx="13"/><text x="158.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Request</text><text x="158.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">Pick two random nodes</text><path class="arrow" d="M266.0 175 H276.0"/><rect class="good" x="281.0" y="125" width="210.0" height="100" rx="13"/><text x="386.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Candidate A</text><text x="386.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">S1: 5 connections</text><path class="arrow" d="M494.0 175 H504.0"/><rect class="node" x="509.0" y="125" width="210.0" height="100" rx="13"/><text x="614.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Candidate B</text><text x="614.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">S3: 12 connections</text><path class="arrow" d="M722.0 175 H732.0"/><rect class="good" x="737.0" y="125" width="210.0" height="100" rx="13"/><text x="842.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Decision</text><text x="842.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">Send to S1</text><text x="500" y="385" text-anchor="middle" font-size="17" fill="#d7e8f7">Pure random is stateless; P2C improves short-term balance with two load checks.</text><text x="500" y="422" text-anchor="middle" font-size="14" fill="#91a9c1">Conceptual architecture diagram — actual implementation details vary.</text></svg>