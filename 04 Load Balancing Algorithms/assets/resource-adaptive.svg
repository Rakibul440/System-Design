<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d">
<title id="t">Resource-Based Adaptive Balancing</title><desc id="d">Servers report CPU, memory and queue metrics; the LB reduces traffic to overloaded nodes.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#83c8f5"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eaf2ff}
.bg{fill:#0b1422} .node{fill:#17334d;stroke:#83c8f5;stroke-width:2}
.good{fill:#174638;stroke:#6bdcb0;stroke-width:2} .warn{fill:#4b303b;stroke:#ff8998;stroke-width:2}
.muted{fill:#a9bfd5;font-size:15px} .arrow{stroke:#83c8f5;stroke-width:3;fill:none;marker-end:url(#arr)}
</style></defs><rect class="bg" width="1000" height="470" rx="18"/><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700">Telemetry feedback loop informs routing</text><rect class="node" x="53.0" y="125" width="210.0" height="100" rx="13"/><text x="158.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Metrics agents</text><text x="158.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">CPU • RAM • queue</text><path class="arrow" d="M266.0 175 H276.0"/><rect class="good" x="281.0" y="125" width="210.0" height="100" rx="13"/><text x="386.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Adaptive LB</text><text x="386.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">Score + thresholds</text><path class="arrow" d="M494.0 175 H504.0"/><rect class="node" x="509.0" y="125" width="210.0" height="100" rx="13"/><text x="614.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Healthy nodes</text><text x="614.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">Receive more traffic</text><path class="arrow" d="M722.0 175 H732.0"/><rect class="warn" x="737.0" y="125" width="210.0" height="100" rx="13"/><text x="842.0" y="163" text-anchor="middle" font-size="18" font-weight="700">Overloaded node</text><text x="842.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">Traffic reduced</text><text x="500" y="385" text-anchor="middle" font-size="17" fill="#d7e8f7">Hysteresis and gradual recovery help prevent oscillation and thrashing.</text><text x="500" y="422" text-anchor="middle" font-size="14" fill="#91a9c1">Conceptual architecture diagram — actual implementation details vary.</text></svg>