<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
<title id="t">Weighted Least Connections</title><desc id="d">Calculate active_connections / weight; choose the lowest score.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#83c8f5"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eaf2ff}
.bg{fill:#0b1422} .node{fill:#17334d;stroke:#83c8f5;stroke-width:2}
.good{fill:#174638;stroke:#6bdcb0;stroke-width:2} .warn{fill:#4b303b;stroke:#ff8998;stroke-width:2}
.muted{fill:#a9bfd5;font-size:15px} .arrow{stroke:#83c8f5;stroke-width:3;fill:none;marker-end:url(#arr)}
</style></defs><rect class="bg" width="1000" height="430" rx="18"/><text x="500" y="42" text-anchor="middle" font-size="23" font-weight="700">Example scores: 10/5, 4/3, 5/2</text><rect class="node" x="167.0" y="125" width="210.0" height="100" rx="13"/><text x="272.0" y="163" text-anchor="middle" font-size="18" font-weight="700">S1</text><text x="272.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">10 / 5 = 2.00</text><path class="arrow" d="M380.0 175 H390.0"/><rect class="good" x="395.0" y="125" width="210.0" height="100" rx="13"/><text x="500.0" y="163" text-anchor="middle" font-size="18" font-weight="700">S2</text><text x="500.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">4 / 3 = 1.33</text><path class="arrow" d="M608.0 175 H618.0"/><rect class="node" x="623.0" y="125" width="210.0" height="100" rx="13"/><text x="728.0" y="163" text-anchor="middle" font-size="18" font-weight="700">S3</text><text x="728.0" y="192" text-anchor="middle" font-size="14" fill="#b5c9dc">5 / 2 = 2.50</text><text x="500" y="345" text-anchor="middle" font-size="17" fill="#d7e8f7">S2 wins because its connection count is lowest relative to its configured capacity.</text><text x="500" y="382" text-anchor="middle" font-size="14" fill="#91a9c1">Conceptual architecture diagram — actual implementation details vary.</text></svg>