<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="t d">
<title id="t">Virtual nodes distribute ownership ranges</title><desc id="d">Three physical servers each have multiple virtual node positions spread around a hash ring.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eaf2ff}.ring{fill:none;stroke:#54799d;stroke-width:5}.a{fill:#ffb86b}.b{fill:#79c8ff}.c{fill:#7ee0b4}.legend{font-size:16px}</style>
<rect width="800" height="390" rx="18" fill="#0b1422"/><circle class="ring" cx="370" cy="190" r="135"/>
<g><circle class="a" cx="370" cy="55" r="10"/><circle class="a" cx="500" cy="160" r="10"/><circle class="a" cx="310" cy="315" r="10"/><circle class="a" cx="240" cy="115" r="10"/>
<circle class="b" cx="455" cy="85" r="10"/><circle class="b" cx="500" cy="250" r="10"/><circle class="b" cx="270" cy="260" r="10"/><circle class="b" cx="235" cy="190" r="10"/>
<circle class="c" cx="370" cy="325" r="10"/><circle class="c" cx="505" cy="190" r="10"/><circle class="c" cx="340" cy="60" r="10"/><circle class="c" cx="235" cy="225" r="10"/></g>
<g class="legend"><circle class="a" cx="610" cy="125" r="8"/><text x="630" y="131">Physical server A</text><circle class="b" cx="610" cy="165" r="8"/><text x="630" y="171">Physical server B</text><circle class="c" cx="610" cy="205" r="8"/><text x="630" y="211">Physical server C</text></g>
<text x="370" y="185" text-anchor="middle" font-size="18">Hash</text><text x="370" y="208" text-anchor="middle" font-size="18">ring</text><text x="400" y="365" text-anchor="middle" font-size="14" fill="#9db5d1">Many positions per server help smooth out range ownership.</text>
</svg>